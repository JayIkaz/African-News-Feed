name: Ingestion

on:
  schedule:
    # 23 minutes past every hour — offset from the top of the hour to avoid
    # piling onto the same minute as everyone else's cron jobs. Replaces the
    # old in-process 60-minute setInterval scheduler.
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: anf-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @workspace/api-server run ingest
