kind = "mobile"
previewPath = "/mobile/"
title = "AfricaNews Mobile"
version = "1.0.0"
id = "artifacts/africa-news-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 23313

[services.development]
run = "pnpm --filter @workspace/africa-news-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/africa-news-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/africa-news-mobile", "run", "serve" ]

[services.env]
PORT = "23313"
BASE_PATH = "/mobile/"
